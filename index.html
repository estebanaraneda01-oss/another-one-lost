<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Another One Lost</title>
<link rel="icon" href="data:,">
<style>
:root{--glass:rgba(45,22,66,.58);--line:rgba(255,255,255,.3);--txt:#fff8ef;--amber:#ffb347;--life:#ff7a8a;--shield:#7fb6ff;--energy:#ffd54a;--ok:#7be0a4;--bad:#ff9a8a;--tb:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Quicksand","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.35;color:var(--txt);padding-top:var(--tb);
 background:linear-gradient(#2a1740,#7a3b6e 60%,#d98a7a) fixed;transition:background .6s}
body.titan{background:linear-gradient(#3a2208,#a9621c 55%,#f0b45a) fixed}
.hidden{display:none!important}
button{font:inherit;color:inherit}
.btn{min-height:56px;font-weight:800;border-radius:20px;border:1.5px solid var(--line);background:linear-gradient(rgba(70,38,96,.78),rgba(45,22,66,.78));padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 18px #0003;transition:transform .15s,opacity .2s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.main{background:linear-gradient(#ffcb6b,#ff9a57);color:#4a1f10;border-color:#fff8;font-size:1.1em}
.panel{background:var(--glass);border:1.5px solid var(--line);border-radius:24px;padding:14px 16px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0003}
.wrap{max-width:980px;margin:0 auto;padding:10px 12px 40px}
h1,h2,h3{margin:.2em 0}
small,.small{font-size:.8em;opacity:.9}
/* barra superior */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;padding:6px 8px;background:rgba(30,12,50,.9);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.tb-g{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.tb-g>span{font-size:1.1em}
.tbtn{min-height:40px;padding:4px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff1;font-weight:800;cursor:pointer;font-size:.85em}
.tbtn.on{background:linear-gradient(#ffcb6b,#ff9a57);color:#4a1f10;border-color:#fff8}
/* título */
#create{text-align:center;padding-top:18px}
#create h1{font-size:2.2em;letter-spacing:.5px;text-shadow:0 0 22px #ffb34788}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.sw{width:56px;height:56px;border-radius:50%;border:3px solid #fff5;cursor:pointer}
.sw.on,.btn.on{outline:4px solid #fff;box-shadow:0 0 18px #fff9}
#cprev{width:150px;height:200px;margin:0 auto;display:block;filter:drop-shadow(0 0 16px #ffd9a0aa)}
input[type=text]{font:inherit;font-size:1.1em;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:#ffffff26;color:var(--txt);width:min(320px,90%);text-align:center}
input::placeholder{color:#fff9}
/* HUD */
.hud{display:grid;gap:8px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hud-top b{font-size:1.15em}
.turns{letter-spacing:4px;font-size:1.3em}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.bar{position:relative;height:34px;border-radius:17px;background:#0004;border:1.5px solid var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:17px;transition:width .6s}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:800;text-shadow:0 1px 3px #000a;font-size:.9em}
.bar.off{opacity:.65}
#b-en i{background:linear-gradient(90deg,#ff9f1a,var(--energy))}
#b-li i{background:linear-gradient(90deg,#e0446a,var(--life))}
#b-sh i{background:linear-gradient(90deg,#4b86e0,var(--shield))}
.items{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0003;border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:700;font-size:.9em}
#banner{display:grid;gap:6px;margin:8px 0}
.ban{border-radius:16px;padding:10px 14px;font-weight:700;border:2px solid #fff6}
.ban.storm{background:linear-gradient(90deg,#c2185bcc,#ff6f3ccc);animation:pulse 1.6s infinite}
.ban.dust{background:#b5762acc}
.ban.info{background:#0004}
@keyframes pulse{50%{filter:brightness(1.25)}}
.sceneBox{border-radius:26px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 36px #0005;margin:8px 0;position:relative}
#scene{display:block;width:100%;height:auto}
#scene .g-titan,#scene .g-mars{display:none}
#scene[data-p=mars] .g-mars{display:inline}
#scene[data-p=titan] .g-titan{display:inline}
.floaty{animation:floaty 4s ease-in-out infinite}
.floaty2{animation:floaty 3s ease-in-out infinite -1s}
.bob{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-9px)}}
.halo{animation:halo 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes halo{50%{opacity:.55;transform:scale(1.18)}}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.spark{animation:spark 6s linear infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:translateY(20px)}20%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
#scene .dustl{opacity:0;transition:opacity 1s}
#scene.dust .dustl{opacity:1}
#scene .streak{animation:streak 3s linear infinite}
@keyframes streak{from{transform:translateX(-900px)}to{transform:translateX(900px)}}
#scene .flareb{opacity:0}
#scene.storm .flareb{opacity:1;animation:blink 1s infinite}
#scene .hit{opacity:0}
#scene.hitting .hit{animation:hit 1.4s}
@keyframes hit{0%,100%{opacity:0}30%{opacity:.7}}
#ship{transition:transform 2.5s ease-in}
#ship.launch{transform:translate(660px,-300px) rotate(0deg)!important}
.panelPan{opacity:1}
#scene.dust .panelPan{opacity:.45}
.goal{font-weight:800}
.forecast{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fc{background:#0003;border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;font-weight:700;font-size:.9em}
.fc.bad{background:#c2185b99}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.task{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:104px;justify-content:center}
.task .e{font-size:1.9em}
.task .n{font-size:.95em;line-height:1.15}
.task .c{font-size:.85em;opacity:.95}
.water{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.water .btn{flex:1 1 220px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.row .btn{flex:1 1 220px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:110;background:#2a1440ee;border:2px solid var(--line);border-radius:20px;padding:12px 18px;max-width:92vw;text-align:center;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(22,8,38,.66);display:flex;align-items:center;justify-content:center;padding:calc(var(--tb) + 8px) 12px 12px;z-index:50;overflow:auto}
.card{width:min(640px,100%);max-height:calc(96vh - var(--tb));overflow:auto}
.mini-head,.dlg-head{display:flex;gap:12px;align-items:center}
.mini-head svg,.dlg-head svg{width:76px;height:76px;flex:none}
.speech{background:#ffffff22;border-radius:18px;padding:10px 14px;flex:1}
.pbar{height:18px;border-radius:9px;background:#0005;margin:10px 0;overflow:hidden;border:1.5px solid var(--line)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be0a4,#d9ff9a);transition:width .4s}
.msg{min-height:1.5em;font-weight:800;color:#ffe9a8;text-align:center}
#mini-area{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:8px 0;min-height:230px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#dlg{z-index:70;align-items:flex-end}
#dlg-name{font-weight:900;color:var(--amber)}
#dlg-img{width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-top:8px}
.gl{opacity:.9;color:#ffe9a8}
ul.l{margin:6px 0;padding-left:22px}
.dsec{border-radius:18px;padding:10px 14px;margin:10px 0}
.dsec.real{background:#1f6b4acc;border:2px solid #7be0a4}
.dsec.model{background:#5a3a8acc;border:2px dashed #cdb4ff}
.dsec h3{font-size:1.05em}
.dsec img{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:6px}
/* minijuegos */
.plants{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.plant{width:84px;min-height:110px;border-radius:18px;border:2px solid var(--line);background:#2f7d4f88;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.plant .big{font-size:2.2em}.plant .bub{background:#fff;color:#000;border-radius:12px;padding:0 8px;font-size:1.3em}
.plant.done{background:#6fc24a88}
.tools{display:flex;gap:10px}
.tool{min-height:56px;padding:8px 18px;border-radius:18px;border:2px solid var(--line);background:#fff2;font-weight:800;cursor:pointer}
.tool.on{outline:4px solid #fff;background:#fff4}
.cv-wrap{position:relative;width:min(100%,340px);aspect-ratio:320/220;border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.cv-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.rocks{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px);touch-action:none;padding:6px}
.rock{height:68px;border-radius:40% 55% 45% 60%;border:2px solid #0004;background:radial-gradient(circle at 35% 30%,#b08a78,#6e4a3e);cursor:pointer;position:relative}
.rock.near{animation:shake .12s infinite;box-shadow:0 0 18px 4px #ffe27a}
.rock.found{background:radial-gradient(circle at 35% 30%,#ffd9a0,#c0702e);box-shadow:0 0 14px 3px #7be0a4}
@keyframes shake{25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
#mg{position:absolute;pointer-events:none;font-size:2.4em;transform:translate(-50%,-50%);left:-100px;top:-100px;filter:drop-shadow(0 2px 4px #0008)}
svg.mg{width:min(100%,340px);height:auto;touch-action:none;border-radius:18px;background:#0003;border:2px solid var(--line)}
.tanks{display:flex;gap:26px;align-items:flex-end}
.tank{width:70px;height:170px;border:4px solid #fff;border-radius:14px;position:relative;background:#0005;overflow:hidden}
.tank .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#58d0ff,#2a7de0)}
.tank .zone{position:absolute;left:0;right:0;background:#7be0a455;border-top:3px dashed #7be0a4;border-bottom:3px dashed #7be0a4}
.tank.ok{box-shadow:0 0 18px #7be0a4}
.hold{min-width:240px;min-height:70px;touch-action:none;user-select:none}
.pickbar{position:relative;width:min(100%,340px);height:46px;border-radius:23px;background:#0006;border:2px solid var(--line);overflow:hidden}
.pickbar .z{position:absolute;top:0;bottom:0;left:40%;width:20%;background:#ffe27a99;box-shadow:0 0 16px #ffe27a}
.pickbar .l{position:absolute;top:4px;bottom:4px;width:16px;border-radius:8px;background:#fff;box-shadow:0 0 14px #fff;left:0}
.icechunk{font-size:3.4em}
/* astronautas y señas */
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;color:inherit}
.agroup{text-align:left;margin:12px 0 2px;font-weight:900;color:var(--amber)}
.astros{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:6px 0}
.acard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;min-height:150px;border-radius:20px}
.acard svg{width:72px;height:96px}
.acard b{font-size:.92em;line-height:1.1}
.adet{display:flex;gap:14px;align-items:center;text-align:left;margin:12px 0;padding:12px 14px;border-radius:20px;background:#0003;border:1.5px solid var(--line)}
.adet #cprev{flex:none;margin:0}
.adet h2{margin:0 0 2px}
.adet p{margin:6px 0}
.atip{margin-top:8px;padding:6px 10px;border-radius:12px;background:#0003;font-size:.92em}
.dlgbtns{display:flex;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.dlgbtns #dlg-ok{flex:1 1 140px}
body.nosign .signbtn{display:none!important}
#signs{z-index:80}
.sgchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sgchip{min-height:48px;padding:6px 14px;border-radius:16px;border:2px solid var(--line);background:#fff2;font-weight:800;cursor:pointer}
.sgchip.on{outline:3px solid #fff;background:#fff4}
.sgview{text-align:center;background:#0003;border-radius:18px;padding:12px;margin:8px 0}
.sgview video,.sgview iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;margin-top:8px}
.sgbig{font-size:3.4em}
.listen{min-height:48px;padding:6px 14px}
/* escena final (video animado) */
#cine{z-index:85}
.cine-card{width:min(820px,100%)}
#cine-stage{border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#0b0620}
#cine-stage svg,#cine-stage video,#cine-stage iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.cine-cap{font-size:1.6em;font-weight:900;min-height:2.2em;margin:10px 0 2px;color:#ffe9a8;text-align:center}
.cine-cap .big{font-size:1.5em;margin-right:6px}
.bigstat{font-size:2em;font-weight:900;text-align:center;margin:10px 0;color:#ffe9a8}
details.more{margin:10px 0;text-align:left}
details.more summary{cursor:pointer;font-weight:800;padding:8px}
@media(max-width:560px){.adet{flex-direction:column;text-align:center}}
@media(max-width:560px){body{font-size:17px}.task{min-height:96px}.tbtn{padding:4px 8px}}

/* ===== portada ===== */
body.cover-on{overflow:hidden}
#cover{position:fixed;inset:0;z-index:300;background:#120a24;display:flex;align-items:center;justify-content:center}
#cover.gone{display:none}
#cstage{position:relative;width:min(100vw,calc(100vh*1672/941));aspect-ratio:1672/941;background:url(assets/portada.jpg) center/100% 100% no-repeat;container-type:inline-size}
#c-play{position:absolute;left:43.2%;top:64.3%;width:21%;height:12.2%;border:0;border-radius:999px;background:transparent;cursor:pointer;color:transparent;font-size:0}
#c-play:hover,#c-play:focus-visible{box-shadow:0 0 0 .5cqw #fff,0 0 3cqw 1cqw #ffd54acc;outline:none;background:#ffffff1f}
#c-more{position:absolute;left:53.7%;transform:translateX(-50%);top:79.2%;width:max(21%,124px);height:max(7.6%,32px);white-space:nowrap;border-radius:999px;border:.35cqw solid #ffcb6b;background:linear-gradient(#4a2a6a,#2d1642);color:#ffe9a8;font:900 max(12px,2.2cqw)/1 "Nunito","Quicksand","Trebuchet MS",system-ui,sans-serif;letter-spacing:.1cqw;cursor:pointer;box-shadow:0 .6cqw 2cqw #0007;display:flex;align-items:center;justify-content:center;gap:.8cqw}
#c-more:hover,#c-more:focus-visible{filter:brightness(1.2);outline:.4cqw solid #fff}
#c-tools{position:fixed;top:10px;right:10px;display:flex;gap:1cqw;z-index:2}
#c-tools button{min-height:40px;padding:4px 12px;border-radius:14px;border:1.5px solid var(--line);background:#1e0c32cc;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
#c-tools button.on{background:linear-gradient(#ffcb6b,#ff9a57);color:#4a1f10}
#more{z-index:400}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mtab{min-height:46px;padding:6px 16px;border-radius:16px;border:2px solid var(--line);background:#fff2;font-weight:800;cursor:pointer}
.mtab.on{outline:3px solid #fff;background:linear-gradient(#ffcb6b,#ff9a57);color:#4a1f10}
.mpane{display:none}.mpane.on{display:block}
.mquote{font-size:1.05em;line-height:1.5;padding:12px 14px;border-radius:18px;background:#0003;border-left:5px solid var(--amber);margin:8px 0}
.mpane h3{color:var(--amber);margin:14px 0 4px}
.mpane ol,.mpane ul{margin:6px 0;padding-left:22px;font-size:.92em}
.mpane li{margin:4px 0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

<div class="wrap">
<!-- ===== CREACIÓN ===== -->
<section id="create" class="panel">
  <h1>🚀 Another One Lost</h1>
  <p data-es="Tu nave chocó en Marte. ¡Ayúdate de tus amigas las enanas marrones y vuelve a la Tierra!" data-en="Your ship crashed on Mars. Get help from your friends the brown dwarfs and find your way back to Earth!"></p>
  <p><button class="btn" id="b-readintro" type="button"></button></p>
  <h3 data-es="Elige a tu astronauta" data-en="Choose your astronaut"></h3>
  <div id="astros"></div>
  <div class="adet" aria-live="polite">
    <svg id="cprev" viewBox="0 0 120 160"></svg>
    <div id="adet-txt"></div>
  </div>

function startTask(id) {

  if (G.turns <= 0) { sfx('bad'); toast(X('Ya no te quedan turnos. Termina el sol 🌙', 'No turns left. End the sol 🌙')); return; }
  if (G.energy < cost) { sfx('bad'); toast(X(`Falta energía: necesitas ${cost} ⚡ y tienes ${G.energy}.`, `Not enough energy: you need ${cost} ⚡ and have ${G.energy}.`)); return; }
  if (T.need) { const m = T.need(); if (m) { sfx('bad'); toast(m); return; } }
  if (T.mini) openMini(id, () => completeTask(id)); else completeTask(id);
}
function completeTask(id) {
  const T = TASKS[id]; G.energy -= T.cost(); G.turns--;

  if (T.out && !isTitan()) G.radExtra += CFG.radOutside;

  toast(msg + (T.out && !isTitan() ? X('  · salir de la base da más radiación ☢️', '  · going outside the base adds radiation ☢️') : ''));
  render(); stageCheck();
}

  else { const s = t.dust ? CFG.solarDust : CFG.solar; G.energy += s; L.push([`${t.dust ? '🌪️ Paneles con polvo' : '☀️ Paneles solares'}: +${s} ⚡`, `${t.dust ? '🌪️ Dusty panels' : '☀️ Solar panels'}: +${s} ⚡`]); }
  G.energy = Math.min(G.energy, 100);

function cineFrame(t) {
  const el = CINE.el, set = (id, a, v) => el(id).setAttribute(a, v);

  const spaceOp = 1 - ease((t - 8.5) / 1.2);

  // Marte

  const ek = ease(t / 9); set('c-earth', 'transform', `translate(${660 - ek * 260},${130 + ek * 510}) scale(${.22 + ek * 5.3})`); set('c-earth', 'opacity', Math.min(1, ease((t - .4) / 1.2)) * (1 - ease((t - 8.7) / 1)));
  // cielo, nubes, mar
  set('c-sky', 'opacity', ease((t - 8.6) / 1.2));
  set('c-clouds', 'opacity', ease((t - 9.4) / 1) * (1 - ease((t - 14) / 1.5) * .5)); set('c-clouds', 'transform', `translate(0,${-Math.max(0, t - 9) * 26})`);
  const sk = ease((t - 11) / 1.8); set('c-sea', 'opacity', sk); set('c-sea', 'transform', `translate(0,${(1 - sk) * 80})`);
  set('c-wave', 'transform', `translate(${Math.sin(t * 2) * 18},0)`);
  // barco
  const bk = ease((t - 12) / 3); set('c-boat', 'opacity', bk > 0 ? 1 : 0); set('c-boat', 'transform', `translate(${lerp(960, 640, bk)},${372 + Math.sin(t * 2.4) * 3})`);
  // cápsula
  let x, y, a, s;
  if (t < 8) { const k = ease(t / 8); x = lerp(200, 470, k); y = lerp(262, 160, k); a = 65; s = .5 + .5 * ease((t - 4) / 4); }
  else if (t < 9) { const k = ease(t - 8); x = lerp(470, 400, k); y = lerp(160, 120, k); a = lerp(65, 0, k); s = 1.05; }
  else if (t < 10.4) { x = 400; y = lerp(120, 205, (t - 9) / 1.4); a = 0; s = 1.05; }
  else if (t < 14.2) { x = 400 + Math.sin(t * 1.6) * 12; y = lerp(205, 330, ease((t - 10.4) / 3.8)); a = Math.sin(t * 1.6) * 5; s = 1.05; }

MINI.ice = (A, api) => {

  const [cI, cD] = $$('canvas', A), gi = cI.getContext('2d'), gd = cD.getContext('2d', { willReadFrequently: true });
  gi.fillStyle = '#6b3a2c'; gi.fillRect(0, 0, W, H);
  const zones = [[30, 100], [130, 70], [225, 120]].map(([x]) => ({ x: x + Math.random() * 30, y: 20 + Math.random() * 130, w: 62, h: 48, found: false }));
  zones.forEach(z => { gi.fillStyle = '#bfeaff'; gi.beginPath(); gi.moveTo(z.x, z.y + z.h); gi.lineTo(z.x + 12, z.y + 6); gi.lineTo(z.x + 30, z.y + 18); gi.lineTo(z.x + 46, z.y); gi.lineTo(z.x + z.w, z.y + z.h); gi.closePath(); gi.fill(); gi.strokeStyle = '#fff'; gi.lineWidth = 3; gi.stroke(); });
  gd.fillStyle = '#b4513b'; gd.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) { gd.fillStyle = Math.random() < .5 ? '#c4624a' : '#9c4231'; gd.fillRect(Math.random() * W, Math.random() * H, 5, 5); }
  let last = null, lastCheck = 0, found = 0;
  const check = () => {
    zones.forEach(z => { if (z.found) return; const d = gd.getImageData(z.x | 0, z.y | 0, z.w, z.h).data; let rem = 0, n = 0; for (let i = 3; i < d.length; i += 16) { n++; if (d[i] > 40) rem++; }
      if (rem / n < .3) { z.found = true; found++; gd.globalCompositeOperation = 'destination-out'; gd.fillRect(z.x - 6, z.y - 6, z.w + 12, z.h + 12); gd.globalCompositeOperation = 'source-over'; api.progress(found); sfx('ok'); api.msg(X('¡Encontraste hielo! 🧊', 'You found ice! 🧊')); if (found >= 3) api.win(); } });

MINI.scrap = (A, api) => {

    if (act != null && drag) { const a = L(act); h += `<path d="M${a.x} ${a.y} L${drag.x} ${drag.y}" stroke="${cols[act]}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>`; }

    svg.innerHTML = h;
  };
  const holeAt = p => { let best = null; holes.forEach((o, i) => { if (!o.f && Math.hypot(o.x - p.x, o.y - p.y) < 28) best = i; }); return best; };
  const drop = p => { const i = holeAt(p); if (i != null) { holes[i].f = true; carry = false; api.progress(holes.filter(o => o.f).length); sfx('ok'); api.msg(X('¡Hueco cubierto! 🧱', 'Hole covered! 🧱')); if (holes.every(o => o.f)) api.win(); } else api.err(X('Suéltala sobre un hueco del techo.', 'Drop it on a hole in the roof.')); draw(); };
  svg.onpointerdown = e => { const p = ptIn(svg, e, 320, 220); start = p; moved = 0;
    if (!carry && Math.hypot(p.x - 55, p.y - 190) < 55) { carry = true; dragging = true; pos = { x: 55, y: 180 }; try { svg.setPointerCapture(e.pointerId); } catch (_) { } api.msg(X('¡Palada lista! Llévala a un hueco.', 'Scoop ready! Take it to a hole.')); draw(); }
    else if (carry) { dragging = false; drop(p); } };
  svg.onpointermove = e => { if (dragging) { pos = ptIn(svg, e, 320, 220); moved = Math.hypot(pos.x - start.x, pos.y - start.y); draw(); } };
  const up = e => { if (!dragging) return; dragging = false; const p = ptIn(svg, e, 320, 220); if (moved > 12) drop(p); else { pos = { x: 55, y: 180 }; draw(); } };
  svg.onpointerup = up; svg.onpointercancel = () => { dragging = false; carry = false; draw(); };
  window.__holes = holes; api.onClose(() => { delete window.__holes; });
  draw();
};

/* ⛽ metano */
MINI.methane = (A, api) => {
  api.total(2); const tk = [{ lv: 0, ok: false }, { lv: 0, ok: false }]; let cur = 0, hold = false;
  const Z0 = 68, Z1 = 88;
  A.innerHTML = `<div class="tanks">${tk.map((_, i) => `<div class="tank" id="tk${i}"><div class="zone" style="bottom:${Z0}%;height:${Z1 - Z0}%"></div><div class="fill"></div></div>`).join('')}</div><button class="btn main hold" id="hb">${X('⛽ Mantén apretado', '⛽ Hold down')}</button>`;
  const hb = $('#hb', A);
  const draw = () => tk.forEach((t, i) => { $('#tk' + i, A).firstElementChild.nextElementSibling.style.height = t.lv + '%'; $('#tk' + i, A).classList.toggle('ok', t.ok); });
  const press = e => { if (M.done || cur > 1) return; hold = true; try { hb.setPointerCapture(e.pointerId); } catch (_) { } api.msg(X('Llenando…', 'Filling…')); };
  const release = () => {
    if (!hold) return; hold = false; const t = tk[cur]; if (!t || t.ok) return;
    if (t.lv >= Z0 && t.lv <= Z1) { t.ok = true; cur++; api.progress(cur); sfx('ok'); api.msg(X('¡Tanque lleno justo! ✅', 'Tank filled just right! ✅')); if (cur >= 2) api.win(); }
    else if (t.lv > Z1) { t.lv = 0; api.err(X('Te pasaste: se derramó.', 'Too much: it spilled.')); }
    else api.msg(X('Falta un poco: sigue llenando 💪', 'A little more: keep filling 💪'));
    draw();
  };
  hb.onpointerdown = press; hb.onpointerup = release; hb.onpointercancel = release; hb.onlostpointercapture = release;
  api.raf((ts, dt) => { if (hold && cur < 2) { const t = tk[cur]; t.lv += 40 * dt; if (t.lv >= 100) { t.lv = 0; hold = false; api.err(X('¡Se derramó!', 'It spilled!')); } draw(); } });
  window.__tanks = tk; api.onClose(() => { delete window.__tanks; });
  draw();
};

/* 🧊 hielo duro (Titán) */
MINI.titanice = (A, api) => {
  api.total(3); let hits = 0, p = 0;
  A.innerHTML = `<div class="icechunk" id="ic">🧊</div><div class="pickbar"><div class="z"></div><div class="l" id="lt"></div></div><button class="btn main" id="pk" style="min-width:220px;min-height:64px">${X('⛏️ ¡Picar!', '⛏️ Chip!')}</button>`;
  const lt = $('#lt', A), t0 = performance.now(), PER = 1.8;
  api.raf(() => { const ph = ((performance.now() - t0) / 1000 / PER) % 1; p = ph < .5 ? ph * 2 : 2 - ph * 2; lt.style.left = `calc(${p * 100}% - ${p * 16}px)`; });
  window.__pickPos = () => p; api.onClose(() => { delete window.__pickPos; });
  $('#pk', A).onclick = () => {
    if (M.done) return; if (p >= .38 && p <= .62) { hits++; api.progress(hits); sfx('ok'); api.msg(X('¡Crac! 💥', 'Crack! 💥')); $('#ic', A).textContent = hits >= 3 ? '💧' : '🧊'; if (hits >= 3) api.win(); } else api.err(X('Espera a que la luz llegue a la zona brillante.', 'Wait for the light to reach the bright zone.'));
  };
};
